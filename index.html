<!DOCTYPE html>
<html lang="en" data-theme="catppuccin">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsidian Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Merriweather:ital,wght@0,300;0,400;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Fira+Code:wght@400;500&family=Source+Code+Pro:wght@400;500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<!-- Markdown Library -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- Code Highlighting -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<!-- MathJax for LaTeX -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] },
    startup: { typeset: false } 
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
:root {
  --sidebar-w: 280px;
  --top-h: 52px;
  --radius: 8px;
  --radius-lg: 12px;
  --trans: 180ms ease;
  --font-ui: 'Syne', sans-serif;
  --font-body: 'Literata', Georgia, serif;
  --font-mono: 'JetBrains Mono', monospace;
}

/* ══ POPULAR THEMES ══════════════════════════════ */
[data-theme="catppuccin"] {
  --bg:#1e1e2e; --bg2:#181825; --bg3:#313244; --bg4:#45475a;
  --border:rgba(205,214,244,0.08); --border2:rgba(205,214,244,0.16);
  --text:#cdd6f4; --text2:#a6adc8; --text3:#6c7086;
  --accent:#cba6f7; --accent2:#d0bfff; --accent-bg:rgba(203,166,247,0.12);
  --danger:#f38ba8; --warn:#fab387; --success:#a6e3a1; --scrollbar:#45475a;
}
[data-theme="dracula"] {
  --bg:#282a36; --bg2:#21222c; --bg3:#343746; --bg4:#44475a;
  --border:rgba(248,248,242,0.08); --border2:rgba(248,248,242,0.15);
  --text:#f8f8f2; --text2:#bfbfcf; --text3:#6272a4;
  --accent:#bd93f9; --accent2:#d4aaff; --accent-bg:rgba(189,147,249,0.12);
  --danger:#ff5555; --warn:#ffb86c; --success:#50fa7b; --scrollbar:#44475a;
}
[data-theme="nord"] {
  --bg:#2e3440; --bg2:#272c36; --bg3:#3b4252; --bg4:#434c5e;
  --border:rgba(236,239,244,0.08); --border2:rgba(236,239,244,0.15);
  --text:#eceff4; --text2:#d8dee9; --text3:#616e88;
  --accent:#88c0d0; --accent2:#a3d0de; --accent-bg:rgba(136,192,208,0.12);
  --danger:#bf616a; --warn:#ebcb8b; --success:#a3be8c; --scrollbar:#434c5e;
}

/* ── BASE ────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);display:flex;flex-direction:column}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* ── TOPBAR ──────────────────────────────────── */
.topbar{height:var(--top-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;z-index:100}
.topbar-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--text);white-space:nowrap}
.logo-gem{width:26px;height:26px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-gem svg{width:14px;height:14px;color:white}
.topbar-sep{width:1px;height:22px;background:var(--border2);flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text3);flex:1;min-width:0;overflow:hidden}
.breadcrumb .sep{color:var(--text3);font-size:11px}
.breadcrumb .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* ── BUTTONS & PANELS ───────────────────────── */
.icon-btn{height:32px;padding:0 10px;min-width:32px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--font-ui);font-size:12px;transition:background var(--trans),color var(--trans),border-color var(--trans);flex-shrink:0;white-space:nowrap}
.icon-btn:hover, .icon-btn.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.icon-btn svg{width:14px;height:14px;flex-shrink:0}

.settings-wrap{position:relative}
.settings-panel{position:absolute;top:calc(100% + 8px);right:0;width:310px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,0.4),0 4px 16px rgba(0,0,0,0.2);z-index:999;overflow:hidden;opacity:0;transform:translateY(-8px) scale(0.97);pointer-events:none;transition:opacity 200ms ease,transform 200ms ease;}
.settings-panel.open{opacity:1;transform:translateY(0) scale(1);pointer-events:all}
.panel-section{padding:14px 14px 12px}
.panel-section+.panel-section{border-top:1px solid var(--border)}
.panel-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.theme-card{border:1.5px solid var(--border);border-radius:9px;padding:9px 8px 8px;cursor:pointer;transition:border-color var(--trans),background var(--trans);background:var(--bg3);display:flex;flex-direction:column;gap:7px;position:relative;}
.theme-card:hover{border-color:var(--border2);background:var(--bg4)}
.theme-card.active{border-color:var(--accent);background:var(--accent-bg)}
.theme-card.active::after{content:'✓';position:absolute;top:5px;right:7px;font-size:9px;color:var(--accent);font-weight:700}
.theme-swatches{display:flex;gap:4px;align-items:center}
.swatch{width:13px;height:13px;border-radius:50%;border:1px solid rgba(128,128,128,0.2);flex-shrink:0}
.theme-name{font-size:10.5px;font-weight:600;color:var(--text2);letter-spacing:-0.01em;line-height:1}
.theme-card.active .theme-name{color:var(--accent)}

.font-options{display:flex;flex-direction:column;gap:2px}
.font-opt{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:7px;cursor:pointer;border:1.5px solid transparent;transition:background var(--trans),border-color var(--trans);}
.font-opt:hover{background:var(--bg3)}
.font-opt.active{background:var(--accent-bg);border-color:var(--accent)}
.font-opt-name{font-size:13px;color:var(--text)}
.font-opt-preview{font-size:11px;color:var(--text3)}
.font-opt.active .font-opt-name{color:var(--accent)}
.font-opt.active .font-opt-preview{color:var(--accent2)}

/* ── LAYOUT & SIDEBAR ────────────────────────── */
.workspace{flex:1;display:flex;overflow:hidden;position:relative}
.sidebar{width:var(--sidebar-w);flex-shrink:0;display:flex;flex-direction:column;background:var(--bg2);border-right:1px solid var(--border);transition:width 260ms cubic-bezier(0.4,0,0.2,1),opacity 260ms ease;overflow:hidden}
.sidebar.collapsed{width:0;opacity:0;border-right-color:transparent}
.sidebar-header{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-header-title{font-size:10.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--text3);flex:1;white-space:nowrap}
.search-wrap{padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
.search-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px 6px 30px;font-family:var(--font-ui);font-size:12.5px;color:var(--text);outline:none;transition:border-color var(--trans),background var(--trans)}
.search-input:focus{border-color:var(--accent);background:var(--bg4)}
.search-icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text3);pointer-events:none}
.file-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 6px}

/* ── NESTED TREE UI ──────────────────────────── */
.sidebar-folder { margin: 1px 0; }
.folder-summary { display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: pointer; font-size: 13.5px; color: var(--text2); user-select: none; border-radius: 6px; transition: background var(--trans); }
.folder-summary:hover { background: var(--bg3); color: var(--text); }
details.sidebar-folder > summary::marker, details.sidebar-folder > summary::-webkit-details-marker { display: none; }
.folder-chevron { width: 14px; height: 14px; color: var(--text3); transition: transform 0.2s; flex-shrink:0;}
details[open] > summary > .folder-chevron { transform: rotate(90deg); }
.folder-icon { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }
.folder-contents { margin-left: 14px; padding-left: 6px; border-left: 1px solid var(--border); display: flex; flex-direction: column; }

.file-item{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;transition:background var(--trans);font-size:13.5px;color:var(--text2);text-decoration:none;border:none;background:none;width:100%;text-align:left;min-width:0;position:relative; border-radius: 6px; margin: 1px 0;}
.file-item:hover{background:var(--bg3);color:var(--text)}
.file-item.active{background:var(--accent-bg);color:var(--accent2); font-weight: 500;}
.file-item-icon{flex-shrink:0;width:15px;height:15px}
.file-item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item-ext{font-family:var(--font-mono);font-size:10px;color:var(--text3);background:var(--bg4);padding:1px 5px;border-radius:3px;flex-shrink:0;letter-spacing:0.03em}
.ext-md{color:var(--accent2)!important;background:var(--accent-bg)!important}

.sidebar-toggle{position:absolute;left:var(--sidebar-w);top:50%;transform:translateY(-50%);z-index:200;width:18px;height:48px;background:var(--bg2);border:1px solid var(--border2);border-left:none;border-radius:0 6px 6px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:left 260ms cubic-bezier(0.4,0,0.2,1),background var(--trans),color var(--trans);color:var(--text3)}
.sidebar-toggle:hover{background:var(--bg3);color:var(--accent)}
.sidebar-toggle svg{width:10px;height:10px;transition:transform 260ms ease}
.workspace.sidebar-collapsed .sidebar-toggle{left:0}
.resize-handle{width:4px;background:transparent;cursor:col-resize;flex-shrink:0;z-index:10;transition:background var(--trans)}
.resize-handle:hover,.resize-handle.dragging{background:var(--accent)}

/* ── CONTENT PANEL ───────────────────────────── */
.content-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.viewer-header{height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.viewer-filename{font-size:13.5px;font-weight:500;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-filename.placeholder{color:var(--text3);font-weight:400;font-style:italic}
.viewer-badge{font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg3);color:var(--text3);border:1px solid var(--border);flex-shrink:0}
.file-viewer{flex:1;overflow-y:auto;background:var(--bg)}
.image-preview{display:flex;align-items:center;justify-content:center;padding:40px;height:100%}
.image-preview img{max-width:100%;max-height:100%;border-radius:var(--radius-lg);box-shadow:0 8px 32px rgba(0,0,0,0.2)}

/* ── MARKDOWN & OBSIDIAN FLAVOR ──────────────── */
.md-content{font-family:var(--font-body);font-size:15.5px;line-height:1.78;color:var(--text);max-width:720px;margin:0 auto;padding:36px 40px 72px}

/* Properties / Frontmatter Box */
.obsidian-properties { margin-bottom: 32px; padding: 16px 20px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); font-family: var(--font-ui); font-size: 13px; }
.property-row { display: flex; margin-bottom: 10px; align-items: baseline;}
.property-row:last-child { margin-bottom: 0; }
.property-key { width: 140px; color: var(--text3); font-weight: 600; flex-shrink:0; text-transform: capitalize; }
.property-value { color: var(--accent2); display: flex; flex-wrap: wrap; gap: 6px; }
.property-pill { background: var(--bg3); padding: 2px 10px; border-radius: 99px; border: 1px solid var(--border2); }

.md-content h1{font-family:var(--font-ui);font-size:28px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:12px;margin:0 0 24px}
.md-content h2{font-family:var(--font-ui);font-size:21px;font-weight:600;color:var(--text);margin:40px 0 14px}
.md-content h3{font-family:var(--font-ui);font-size:17px;font-weight:600;color:var(--accent2);margin:28px 0 10px}
.md-content h4{font-family:var(--font-ui);font-size:15px;font-weight:600;color:var(--warn);margin:24px 0 10px}
.md-content h5{font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--success);margin:20px 0 8px}
.md-content h6{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin:20px 0 8px}

.md-content p{margin:0 0 16px}
.md-content a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-bg);transition:border-color var(--trans)}
.md-content a:hover{border-bottom-color:var(--accent)}

.md-content ul,.md-content ol{margin:0 0 16px 24px}
.md-content li{margin-bottom:6px}
.md-content li::marker{color:var(--text3);font-weight:bold}

.md-content blockquote{border-left:3px solid var(--accent);background:var(--accent-bg);margin:0 0 16px;padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0;font-style:italic;}
.md-content pre{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;margin:0 0 20px;overflow-x:auto}
.md-content pre code{font-family:var(--font-mono);font-size:13px;color:var(--text);background:none;padding:0;border:none;}
.md-content code{font-family:var(--font-mono);font-size:13px;background:var(--bg3);border:1px solid var(--border);color:var(--accent2);padding:2px 6px;border-radius:4px}
.md-content img{max-width:100%;border-radius:var(--radius-lg);margin:8px 0}
.md-content hr{border:none;border-top:1px solid var(--border);margin:32px 0}
.md-content table{width:100%;border-collapse:collapse;margin:0 0 20px;font-size:14px}
.md-content th{background:var(--bg2);text-align:left;padding:8px 12px;border:1px solid var(--border);font-weight:600;font-family:var(--font-ui);font-size:13px}
.md-content td{padding:8px 12px;border:1px solid var(--border)}
.md-content tr:nth-child(even) td{background:var(--bg2)}

/* Obsidian Wikilinks */
.wikilink { color: var(--accent); text-decoration: none; cursor: pointer; font-weight: 500; background: var(--accent-bg); padding: 0 4px; border-radius: 4px; transition: background var(--trans); }
.wikilink:hover { background: rgba(203,166,247,0.25); text-decoration: underline; }

/* Obsidian Tags (#tag) */
.obsidian-tag { background: var(--bg3); color: var(--accent); padding: 2px 8px; border-radius: 99px; font-size: 12.5px; font-weight: 600; font-family: var(--font-ui); transition: background var(--trans), color var(--trans); cursor: pointer; }
.obsidian-tag:hover { background: var(--accent-bg); }

/* Obsidian Highlights */
.obsidian-highlight { background-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--text); padding: 2px 6px; border-radius: 4px; font-weight: 500; }

/* Obsidian Callouts */
.callout { border-left: 4px solid var(--accent); background: var(--bg2); border-radius: 4px; padding: 12px 16px; margin: 16px 0; font-family: var(--font-ui); }
.callout-title { font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; color: var(--accent); }
.callout-content { font-family: var(--font-body); }
.callout-content p:last-child { margin-bottom: 0; }
.callout-warning, .callout-caution { border-left-color: var(--warn); }
.callout-warning .callout-title, .callout-caution .callout-title { color: var(--warn); }
.callout-danger, .callout-error, .callout-bug { border-left-color: var(--danger); }
.callout-danger .callout-title, .callout-error .callout-title, .callout-bug .callout-title { color: var(--danger); }
.callout-success, .callout-check, .callout-done { border-left-color: var(--success); }
.callout-success .callout-title, .callout-check .callout-title, .callout-done .callout-title { color: var(--success); }

/* Obsidian Checkboxes */
.md-content input[type="checkbox"] { appearance: none; width: 16px; height: 16px; border: 2px solid var(--text3); border-radius: 4px; margin-right: 8px; vertical-align: middle; margin-top: -2px; position: relative; background: var(--bg2); cursor: not-allowed; }
.md-content input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
.md-content input[type="checkbox"]:checked::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(45deg); }

/* ── STATES & TOAST ──────────────────────────── */
.raw-content{font-family:var(--font-mono);font-size:13px;line-height:1.65;color:var(--text);padding:28px 32px 72px;white-space:pre-wrap;word-break:break-word;}
.state-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 32px;text-align:center;gap:12px;min-height:300px}
.state-icon{font-size:36px;line-height:1}
.state-title{font-size:16px;font-weight:600;color:var(--text)}
.state-sub{font-size:13px;color:var(--text3);max-width:320px;line-height:1.6}
.state-card.error .state-title{color:var(--danger)}
.empty-list{padding:32px 16px;text-align:center;font-size:12px;color:var(--text3)}
.count-badge{font-family:var(--font-mono);font-size:10px;background:var(--bg3);color:var(--text3);padding:1px 6px;border-radius:99px;border:1px solid var(--border)}

.skeleton{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:4px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-item{height:32px;margin:4px 10px;border-radius:var(--radius)}

#toast{position:fixed;bottom:20px;right:20px;background:var(--bg4);border:1px solid var(--border2);color:var(--text);font-size:12.5px;padding:9px 14px;border-radius:var(--radius-lg);z-index:9999;transform:translateY(60px);opacity:0;transition:transform 220ms ease,opacity 220ms ease;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
#toast.show{transform:translateY(0);opacity:1}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-logo">
    <div class="logo-gem">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10"/></svg>
    </div>
    <span>Obsidian Explorer</span>
  </div>
  <div class="topbar-sep"></div>
  <div class="breadcrumb" id="breadcrumb"><span class="cur">Loading Vault...</span></div>
  <div class="topbar-actions">
    <button class="icon-btn" id="refreshBtn" title="Refresh Vault (R)">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    </button>
    <div class="settings-wrap">
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span id="settingsBtnLabel">Catppuccin</span>
      </button>
      <div class="settings-panel" id="settingsPanel">
        <div class="panel-section">
          <div class="panel-label">GitHub Access Token (PAT)</div>
          <input type="password" id="patInput" placeholder="ghp_xxxxxxxxxxxx" style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg3); color:var(--text); font-family:var(--font-mono); font-size:11px; outline:none;">
          <div style="font-size:10.5px; color:var(--text3); margin-top:6px; line-height:1.4;">Paste token to bypass 60/hr API limit. Saves locally.</div>
        </div>
        <div class="panel-section">
          <div class="panel-label">Theme</div>
          <div class="theme-grid" id="themeGrid"></div>
        </div>
        <div class="panel-section">
          <div class="panel-label">Reading Font</div>
          <div class="font-options" id="bodyFontOpts"></div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="workspace" id="workspace">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <svg style="width:13px;height:13px;color:var(--text3);flex-shrink:0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
      <span class="sidebar-header-title">Files</span>
      <span class="count-badge" id="fileCount">—</span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
      <input class="search-input" type="text" id="searchInput" placeholder="Search entire vault… (F)" autocomplete="off" spellcheck="false">
    </div>
    <div class="file-list" id="fileList"></div>
  </aside>

  <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar (B)">
    <svg id="toggleIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
  </button>

  <div class="content-panel">
    <div class="viewer-header">
      <span class="viewer-filename placeholder" id="viewerTitle">Select a file to view</span>
      <span class="viewer-badge" id="viewerBadge" style="display:none"></span>
    </div>
    <div class="file-viewer" id="fileViewer">
      <div class="state-card">
        <div class="state-icon">📄</div>
        <div class="state-title">Nothing open</div>
        <div class="state-sub">Choose a file from the sidebar. Markdown renders beautifully with your chosen theme and font.</div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// --- GITHUB REPO CONFIG ---
const OWNER = 'najmossalahin', REPO = 'Obsidian_Uni';

// Global State
let vaultIndex = [];
let treeRoot = {};
let activeFile = null;
let sidebarOpen = true;

const sidebar = document.getElementById('sidebar');
const workspace = document.getElementById('workspace');
const fileList = document.getElementById('fileList');
const searchInput = document.getElementById('searchInput');
const fileViewer = document.getElementById('fileViewer');
const viewerTitle = document.getElementById('viewerTitle');
const viewerBadge = document.getElementById('viewerBadge');
const breadcrumb = document.getElementById('breadcrumb');
const fileCount = document.getElementById('fileCount');

/* ── SETTINGS & PAT TOKEN ────────────────────── */
const patInput = document.getElementById('patInput');
patInput.value = localStorage.getItem('oe-pat') || '';
patInput.addEventListener('change', e => { 
  localStorage.setItem('oe-pat', e.target.value.trim()); 
  showToast('Token saved!'); 
  initVault(); // reload with new limits
});

function getHeaders() {
  const pat = localStorage.getItem('oe-pat');
  return pat ? { 'Authorization': `token ${pat}` } : {};
}

/* ── THEMES & FONTS ─────────────────────────── */
const THEMES = [
  {id:'catppuccin', name:'Catppuccin', bg:'#1e1e2e', mid:'#313244', acc:'#cba6f7'},
  {id:'dracula',    name:'Dracula',    bg:'#282a36', mid:'#343746', acc:'#bd93f9'},
  {id:'nord',       name:'Nord',       bg:'#2e3440', mid:'#3b4252', acc:'#88c0d0'},
  {id:'rosepine',   name:'Rosé Pine',  bg:'#191724', mid:'#26233a', acc:'#eb6f92'},
  {id:'github',     name:'GitHub',     bg:'#ffffff', mid:'#eaeef2', acc:'#0969da'},
];
const BODY_FONTS = [
  {id:'Literata',     name:'Literata',     preview:'Beautiful serif'},
  {id:'Merriweather', name:'Merriweather', preview:'Highly readable'},
  {id:'JetBrains Mono', name:'JetBrains',  preview:'Monospace'},
];

let curTheme = localStorage.getItem('oe-theme') || 'catppuccin';
let curBodyFont = localStorage.getItem('oe-body-font') || 'Literata';

function applyTheme(id){ 
  curTheme = id; document.documentElement.dataset.theme = id; localStorage.setItem('oe-theme',id); 
  document.getElementById('settingsBtnLabel').textContent = THEMES.find(x=>x.id===id)?.name || id;
  document.querySelectorAll('.theme-card').forEach(c=>c.classList.toggle('active',c.dataset.id===id));
}
function applyBodyFont(id){
  curBodyFont = id; document.documentElement.style.setProperty('--font-body',`'${id}',Georgia,serif`); localStorage.setItem('oe-body-font',id);
  document.querySelectorAll('#bodyFontOpts .font-opt').forEach(o=>o.classList.toggle('active',o.dataset.id===id));
}

(function(){
  const grid=document.getElementById('themeGrid');
  THEMES.forEach(t=>{
    const el=document.createElement('div');
    el.className='theme-card'+(t.id===curTheme?' active':''); el.dataset.id=t.id;
    el.innerHTML=`<div class="theme-swatches"><div class="swatch" style="background:${t.bg}"></div><div class="swatch" style="background:${t.mid}"></div><div class="swatch" style="background:${t.acc}"></div></div><div class="theme-name">${t.name}</div>`;
    el.onclick = () => { applyTheme(t.id); showToast(t.name); };
    grid.appendChild(el);
  });
  const wrap = document.getElementById('bodyFontOpts');
  BODY_FONTS.forEach(f=>{
    const el=document.createElement('div'); el.className='font-opt'+(f.id===curBodyFont?' active':''); el.dataset.id=f.id;
    el.innerHTML=`<span class="font-opt-name" style="font-family:'${f.id}',serif">${f.name}</span><span class="font-opt-preview" style="font-family:'${f.id}',serif;font-style:italic">${f.preview}</span>`;
    el.onclick = () => { applyBodyFont(f.id); showToast(f.name); };
    wrap.appendChild(el);
  });
})();
applyTheme(curTheme); applyBodyFont(curBodyFont);

/* Settings toggle */
document.getElementById('settingsBtn').onclick = e => { e.stopPropagation(); document.getElementById('settingsPanel').classList.toggle('open'); };
document.addEventListener('click', e => { if(!e.target.closest('.settings-wrap')) document.getElementById('settingsPanel').classList.remove('open'); });

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg; toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function fileIcon(name,type){
  if(type==='tree') return`<svg class="folder-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>`;
  if(/\.(jpe?g|png|gif|webp|svg)$/i.test(name)) return`<svg class="file-item-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" style="color:#6bceff"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path stroke-linecap="round" d="M21 15l-5-5L5 21"/></svg>`;
  if(/\.md$/i.test(name)) return`<svg class="file-item-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" style="color:var(--accent2)"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>`;
  return`<svg class="file-item-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" style="color:var(--text3)"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>`;
}
function extBadge(name){
  const m=name.match(/\.([a-z0-9]+)$/i);if(!m)return'';
  const ext=m[1].toLowerCase();
  return`<span class="file-item-ext ${ext==='md'?'ext-md':''}">${ext}</span>`;
}

/* ── INITIALIZE VAULT (GLOBAL TREE) ──────────── */
async function initVault() {
  fileList.innerHTML = Array.from({length:6},(_,i)=>`<div class="skeleton skeleton-item" style="animation-delay:${i*35}ms"></div>`).join('');
  try {
    // We only need 1 API call for the entire website. Uses PAT if available.
    let res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/main?recursive=1`, { headers: getHeaders() });
    if (!res.ok) res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/master?recursive=1`, { headers: getHeaders() });
    if (!res.ok) throw new Error('Failed to load. Rate limit hit?');

    const data = await res.json();
    vaultIndex = data.tree; // Global flat list
    
    // Build Hierarchical Tree
    treeRoot = {};
    vaultIndex.forEach(item => {
      const parts = item.path.split('/');
      let current = treeRoot;
      for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        if (!current[part]) {
          current[part] = { _item: i === parts.length - 1 ? item : { type: 'tree', path: parts.slice(0, i+1).join('/') }, _children: {} };
        }
        if (i < parts.length - 1) current = current[part]._children;
      }
    });

    renderSidebar();
    
    // Load URL state
    const urlPath = new URLSearchParams(window.location.search).get('path');
    if (urlPath) openFileFromTree(urlPath);
    else updateBreadcrumbs();

  } catch (e) {
    console.error(e);
    fileList.innerHTML = `<div class="empty-list" style="color:var(--danger)">API Limit reached.<br><br>Please open Settings (gear icon) and paste a GitHub Token.</div>`;
  }
}

/* ── NESTED SIDEBAR RENDERER ─────────────────── */
function renderSidebar(filterText = '') {
  const q = filterText.trim().toLowerCase();
  
  function buildHTML(node) {
    let html = '';
    const keys = Object.keys(node).sort((a,b) => {
      const aIsDir = node[a]._item.type === 'tree';
      const bIsDir = node[b]._item.type === 'tree';
      if(aIsDir !== bIsDir) return aIsDir ? -1 : 1;
      return a.localeCompare(b);
    });

    for(const key of keys) {
      const child = node[key];
      const item = child._item;
      item.name = key;

      if(item.type === 'tree') {
        const childrenHtml = buildHTML(child._children);
        if (q && !childrenHtml) continue; // Hide empty folders during search
        
        const isOpen = q ? 'open' : '';
        html += `<details class="sidebar-folder" ${isOpen}>
                  <summary class="folder-summary">
                    <svg class="folder-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                    ${fileIcon(item.name, 'tree')}
                    <span class="file-item-name">${key}</span>
                  </summary>
                  <div class="folder-contents">${childrenHtml}</div>
                </details>`;
      } else {
        if (q && !key.toLowerCase().includes(q)) continue;
        const isActive = activeFile === item.path ? 'active' : '';
        const safePath = item.path.replace(/'/g, "\\'");
        html += `<button class="file-item ${isActive}" onclick="openFileFromTree('${safePath}')">
                  ${fileIcon(item.name, 'blob')}
                  <span class="file-item-name">${item.name}</span>
                  ${item.type==='blob' ? extBadge(item.name) : ''}
                </button>`;
      }
    }
    return html;
  }

  fileList.innerHTML = buildHTML(treeRoot);
  
  // Update file count
  if(q) {
    fileCount.textContent = fileList.querySelectorAll('.file-item').length;
  } else {
    fileCount.textContent = vaultIndex.filter(i=>i.type==='blob').length;
  }
}

searchInput.addEventListener('input', e => renderSidebar(e.target.value));

/* ── FILE READING (Bypasses API limits) ──────── */
async function openFileFromTree(path) {
  activeFile = path;
  history.pushState({path}, '', `?path=${encodeURIComponent(path)}`);
  
  // Re-render sidebar to apply 'active' class accurately
  renderSidebar(searchInput.value);
  updateBreadcrumbs();

  const item = vaultIndex.find(f => f.path === path);
  if(!item) return;

  const name = path.split('/').pop();
  const ext = name.split('.').pop().toLowerCase();
  viewerTitle.textContent = name;
  viewerTitle.classList.remove('placeholder');
  viewerBadge.style.display=''; viewerBadge.textContent='.'+ext;

  fileViewer.innerHTML = `<div class="state-card"><div class="skeleton skeleton-item" style="width:200px"></div><div class="skeleton skeleton-item" style="width:100%"></div></div>`;

  // We construct the raw download URL directly! ZERO API calls used for reading!
  const rawUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${path.split('/').map(encodeURIComponent).join('/')}`;

  if(/\.(jpe?g|png|gif|webp|svg)$/i.test(name)) {
    fileViewer.innerHTML=`<div class="image-preview"><img src="${rawUrl}" alt="${name}"></div>`;
    return;
  }

  try {
    const res = await fetch(rawUrl);
    if (!res.ok) throw new Error();
    const raw = await res.text();

    if (ext === 'md') {
      const div = document.createElement('div');
      div.className = 'md-content';
      
      const { text: processedRaw, propertiesHtml } = preprocessObsidian(raw);
      
      // Render properties box at the very top, then parsed markdown
      div.innerHTML = propertiesHtml + marked.parse(processedRaw, { breaks: true, gfm: true });
      
      fileViewer.innerHTML = '';
      fileViewer.appendChild(div);

      // Fix relative markdown images (![img](./img.png))
      div.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src');
        if (src && !src.startsWith('http') && !src.startsWith('data:')) {
          const parts = activeFile.split('/');
          parts.pop(); // Remove current filename
          const relativeParts = src.split('/');
          for (const p of relativeParts) {
            if (p === '..') parts.pop();
            else if (p !== '.') parts.push(p);
          }
          img.src = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${parts.join('/').split('/').map(encodeURIComponent).join('/')}`;
        }
      });

      div.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
      if (window.MathJax) MathJax.typesetPromise([div]).catch(e => console.log('MathJax Error:', e));

    } else {
      fileViewer.innerHTML = `<div class="raw-content">${raw.replace(/</g, '&lt;')}</div>`;
    }
  } catch (e) {
    fileViewer.innerHTML = `<div class="state-card error"><div class="state-icon">❌</div><div class="state-title">Error loading file</div></div>`;
  }
}

/* ── PRE-PROCESS OBSIDIAN SYNTAX ─────────────── */
function preprocessObsidian(rawText) {
  let text = rawText;
  let propertiesHtml = '';

  // 1. Extract Frontmatter (YAML Properties)
  const fmRegex = /^---\n([\s\S]*?)\n---(\n|$)/;
  const fmMatch = text.match(fmRegex);
  if (fmMatch) {
    text = text.replace(fmRegex, ''); // Remove it from raw markdown
    const lines = fmMatch[1].split('\n').filter(l => l.trim());
    let props = '';
    
    lines.forEach(l => {
      const colonIdx = l.indexOf(':');
      if (colonIdx === -1) return;
      const key = l.substring(0, colonIdx).trim();
      let val = l.substring(colonIdx + 1).trim();

      if (val.startsWith('[') && val.endsWith(']')) {
        const items = val.slice(1, -1).split(',').map(i => i.trim());
        val = items.map(i => `<span class="property-pill">${i.replace(/['"]/g,'')}</span>`).join('');
      } else if (val) {
        if(val.startsWith('"') && val.endsWith('"')) val = val.slice(1,-1);
        val = `<span class="property-pill">${val}</span>`;
      }
      props += `<div class="property-row"><div class="property-key">${key}</div><div class="property-value">${val}</div></div>`;
    });
    if (props) propertiesHtml = `<div class="obsidian-properties">${props}</div>`;
  }

  // 2. Checkboxes
  text = text.replace(/^(\s*)- \[ \]/gm, '$1- <input type="checkbox" disabled>');
  text = text.replace(/^(\s*)- \[(x|X)\]/gm, '$1- <input type="checkbox" checked disabled>');

  // 3. Highlights
  text = text.replace(/==(.*?)==/g, '<mark class="obsidian-highlight">$1</mark>');

  // 4. Tags
  text = text.replace(/(^|\s)#([a-zA-Z0-9_/-]+)/g, '$1<span class="obsidian-tag">#$2</span>');

  // 5. Embeds ![[image.png]]
  text = text.replace(/!\[\[(.*?)\]\]/g, (match, inner) => {
    let [filename, size] = inner.split('|');
    filename = filename.trim();
    
    // Search global vault index for the file
    const found = vaultIndex.find(f => f.path.endsWith(filename));
    if (found) {
      const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${found.path.split('/').map(encodeURIComponent).join('/')}`;
      if (/\.(jpe?g|png|gif|webp|svg)$/i.test(filename)) {
        let widthStyle = size ? `width:${size}px;` : 'max-width:100%;';
        return `<img src="${url}" alt="${filename}" style="${widthStyle} border-radius:var(--radius-lg); margin:8px 0; box-shadow:0 4px 16px rgba(0,0,0,0.1);">`;
      } else {
        return `<a class="wikilink" onclick="openWikilink('${found.path.replace(/'/g, "\\'")}')">📎 ${filename}</a>`;
      }
    }
    return `<span style="color:var(--danger)">⚠️ Missing Embed: ${filename}</span>`;
  });

  // 6. Wikilinks [[Link#Header]]
  text = text.replace(/\[\[(.*?)\]\]/g, (match, inner) => {
    let [link, display] = inner.split('|');
    display = display || link;
    let [fileTarget, anchor] = link.split('#');
    fileTarget = fileTarget.trim();

    const safeLink = fileTarget.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    const anchorPart = anchor ? `', '${anchor.replace(/'/g, "\\'")}` : `', ''`;

    return `<span class="wikilink" title="${link}" onclick="openWikilink('${safeLink}${anchorPart}')">${display}</span>`;
  });

  // 7. Callouts
  text = text.replace(/^> \[!([a-zA-Z]+)\](.*?)\n([\s\S]*?)(?=\n\n|\n> \[!|$)/gm, (match, type, title, content) => {
    const cleanContent = content.replace(/^>\s?/gm, '');
    return `<div class="callout callout-${type.toLowerCase()}">
              <div class="callout-title">${title.trim() || type.toUpperCase()}</div>
              <div class="callout-content">\n\n${cleanContent}\n\n</div>
            </div>`;
  });

  return { text, propertiesHtml };
}

/* ── WIKILINK ANCHOR NAVIGATION ──────────────── */
window.openWikilink = async function(target, anchor='') {
  let searchName = target.trim().toLowerCase();
  
  if(!searchName) {
    if(anchor) scrollToAnchor(anchor);
    return;
  }

  showToast(`Opening ${target}...`);
  if (!searchName.endsWith('.md')) searchName += '.md';

  const found = vaultIndex.find(f => f.path.toLowerCase().endsWith(searchName));
  if (found) {
    await openFileFromTree(found.path);
    if(anchor) setTimeout(() => scrollToAnchor(anchor), 400); // Wait for render
  } else {
    showToast(`File not found: ${target}`);
  }
};

function scrollToAnchor(anchor) {
  const id = anchor.toLowerCase().replace(/[^\w]+/g, '-');
  const el = document.getElementById(id);
  if(el) {
    el.scrollIntoView({behavior: 'smooth', block: 'start'});
    el.style.color = 'var(--accent)';
    setTimeout(()=>el.style.color='', 2000);
  }
}

function updateBreadcrumbs() {
  if(!activeFile) {
    breadcrumb.innerHTML = `<span class="cur" style="color:var(--text3)">${REPO}</span>`;
    return;
  }
  const parts = activeFile.split('/');
  breadcrumb.innerHTML = `<span class="cur" style="color:var(--text3)">${REPO}</span>`;
  parts.forEach((part, i) => {
    breadcrumb.innerHTML += ` <span class="sep">/</span> <span class="cur" ${i===parts.length-1?'style="color:var(--text)"':''}>${part}</span>`;
  });
}

/* ── SIDEBAR RESIZE ──────────────────────────── */
document.getElementById('sidebarToggle').addEventListener('click', () => {
  sidebarOpen = !sidebarOpen;
  sidebar.classList.toggle('collapsed', !sidebarOpen);
  workspace.classList.toggle('sidebar-collapsed', !sidebarOpen);
  document.getElementById('toggleIcon').style.transform = sidebarOpen ? '' : 'rotate(180deg)';
});
(function(){
  let drag=false,sx=0,sw=0;
  const h=document.createElement('div'); h.className='resize-handle'; sidebar.after(h);
  h.addEventListener('mousedown',e=>{ if(!sidebarOpen)return;drag=true;sx=e.clientX;sw=sidebar.offsetWidth; h.classList.add('dragging');document.body.style.cssText+='cursor:col-resize;user-select:none'; });
  document.addEventListener('mousemove',e=>{ if(!drag)return; const w=Math.max(160,Math.min(500,sw+e.clientX-sx)); sidebar.style.width=w+'px';workspace.style.setProperty('--sidebar-w',w+'px'); });
  document.addEventListener('mouseup',()=>{ if(!drag)return;drag=false;h.classList.remove('dragging'); document.body.style.cursor='';document.body.style.userSelect=''; });
})();

/* ── KEYBOARD SHORTCUTS ──────────────────────── */
document.addEventListener('keydown',e=>{
  if(e.target===searchInput){if(e.key==='Escape'){searchInput.value='';renderSidebar();searchInput.blur();}return;}
  if(e.key==='f'||e.key==='F'){ e.preventDefault(); searchInput.focus(); }
  if(e.key==='r'||e.key==='R'){ e.preventDefault(); initVault(); showToast('Refreshed vault'); }
});

document.getElementById('refreshBtn').onclick = () => { initVault(); showToast('Refreshed vault'); };
window.addEventListener('popstate', () => {
  const p = new URLSearchParams(window.location.search).get('path');
  if(p) openFileFromTree(p);
});

// Start the Engine!
initVault();
</script>
</body>
</html>
